[project]
name = "telcopulse"
version = "0.1.0"
description = "Customer sentiment intelligence and business impact engine"
requires-python = ">=3.11,<3.13"
dependencies = [
    "google-play-scraper",
    "pydantic>=2",
    "pyyaml",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "pytest",
    "pytest-cov",
    "pre-commit",
    "mypy",
]

[tool.setuptools.packages.find]
include = ["src*", "api*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]